name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run format:check

  review-gate:
    name: Review gate
    needs: lint
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Request and wait for CodeRabbit review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CODERABBIT_TRIGGER_TOKEN }}
          script: |
            const pullNumber = context.issue.number;
            const sha = context.payload.pull_request.head.sha;
            
            async function getPullRequest() {
              const { data } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: pullNumber,
              });
            
              return data;
            }
            
            async function getRabbitStatus() {
              const statuses = await github.paginate(
                github.rest.repos.listCommitStatusesForRef,
                {
                  ...context.repo,
                  ref: sha,
                  per_page: 100,
                },
              );
            
              return statuses.find(
                (status) =>
                  status.context === 'CodeRabbit' &&
                  status.creator?.login === 'coderabbitai[bot]',
              );
            }
            
            function isCompleted(status) {
              return (
                status?.state === 'success' &&
                /review completed/i.test(status.description ?? '') &&
                !/skip/i.test(status.description ?? '')
              );
            }
            
            async function finish(message, warning = false) {
              if (warning) {
                core.warning(message);
              } else {
                core.info(message);
              }
            
              await core.summary
                .addHeading('Review gate')
                .addRaw(message)
                .write();
            }
            
            try {
              const pr = await getPullRequest();
            
              if (pr.state !== 'open' || pr.draft || pr.head.sha !== sha) {
                await finish('PR is closed, draft, or has newer commits.');
            
                return;
              }
            
              let initialStatus;
              let baselineRead = false;
            
              try {
                initialStatus = await getRabbitStatus();
                baselineRead = true;
              } catch (error) {
                core.warning(`Could not read initial CodeRabbit status: ${error.message}`);
              }
            
              if (isCompleted(initialStatus)) {
                await finish(
                  `CodeRabbit already completed review for ${sha}. Findings are left to the user.`,
                );
            
                return;
              }
            
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pullNumber,
                body: '@coderabbitai review',
              });
            
              if (!baselineRead) {
                await finish(
                  'Review requested, but the initial status could not be read. Completion cannot be confirmed safely. Merge is allowed under the soft-gate policy.',
                  true,
                );
            
                return;
              }
            
              const initialStatusId = initialStatus?.id ?? 0;
              const deadline = Date.now() + 10 * 60 * 1000;
            
              for (; Date.now() < deadline;) {
                await new Promise((resolve) => setTimeout(resolve, 15000));
            
                const currentPr = await getPullRequest();
            
                if (
                  currentPr.state !== 'open' ||
                  currentPr.draft ||
                  currentPr.head.sha !== sha
                ) {
                  await finish('PR changed; this run no longer applies.');
            
                  return;
                }
            
                const status = await getRabbitStatus();
            
                if (!status || status.id <= initialStatusId) {
                  continue;
                }
            
                const description = status.description ?? '';
            
                core.info(`${status.state}: ${description}`);
            
                if (/skip/i.test(description)) {
                  continue;
                }
            
                if (isCompleted(status)) {
                  await finish(
                    `CodeRabbit completed review for ${sha}. Findings are left to the user.`,
                  );
            
                  return;
                }
            
                if (['error', 'failure'].includes(status.state)) {
                  await finish(
                    `CodeRabbit reported: ${description}. Merge is allowed under the soft-gate policy.`,
                    true,
                  );
            
                  return;
                }
              }
            
              await finish(
                'No confirmed review completion within 10 minutes. Merge is allowed under the soft-gate policy.',
                true,
              );
            } catch (error) {
              await finish(
                `Could not request or monitor review: ${error.message}. Merge is allowed under the soft-gate policy.`,
                true,
              );
            }
