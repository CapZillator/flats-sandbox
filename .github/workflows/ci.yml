name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run format:check

  request-codex-review:
    name: Request Codex review
    needs: lint
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      statuses: write

    steps:
      - name: Mark review as pending for the validated commit
        id: review
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            });

            if (
              pr.state !== 'open' ||
              pr.draft ||
              pr.head.sha !== context.payload.pull_request.head.sha
            ) {
              core.info('Skipping review request: PR is closed, draft, or has newer commits.');

              return;
            }

            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: pr.head.sha,
              context: 'Codex review',
              state: 'pending',
              description: 'Waiting for Codex review.',
            });
            core.setOutput('sha', pr.head.sha);

      - name: Request Codex review
        if: steps.review.outputs.sha != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CODERABBIT_TRIGGER_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: '@codex review',
            });

      - name: Release review status if the request failed
        if: failure() && steps.review.outputs.sha != ''
        uses: actions/github-script@v7
        env:
          REVIEW_SHA: ${{ steps.review.outputs.sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.REVIEW_SHA,
              context: 'Codex review',
              state: 'success',
              description: 'Review request failed; merge allowed by soft-gate policy.',
            });
            core.warning('Codex review could not be requested. Merge is allowed without review.');
