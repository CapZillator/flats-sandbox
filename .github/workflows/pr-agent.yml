name: PR-Agent

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    name: Review pull request
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/review' &&
      github.event.sender.type != 'Bot' &&
      contains(
        fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event.comment.author_association
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Run PR-Agent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CONFIG__MODEL: openrouter/openrouter/minimax/minimax-m3
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "32000"
          CONFIG__FALLBACK_MODELS: "[]"
          CONFIG__OUTPUT_RUN_DETAILS: "true"
          CONFIG__OUTPUT_RUN_COST: "true"
          OPENROUTER__MAX_TOKENS: "32000"
          PR_REVIEWER__NUM_MAX_FINDINGS: "10"
