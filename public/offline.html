<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#ededed" />
    <title>Offline · Manden</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #ededed;
        color: #181c1c;
        font:
          16px Inter,
          system-ui,
          sans-serif;
      }
      main {
        width: min(32rem, calc(100% - 2rem));
        padding: 2.5rem;
        border: 1px solid #c9cece;
        background: #fff;
      }
      .mark {
        display: grid;
        width: 3rem;
        height: 3rem;
        place-items: center;
        background: #ffe562;
        font-weight: 800;
      }
      h1 {
        margin: 1.5rem 0 0.75rem;
        font-size: clamp(2rem, 8vw, 3rem);
        line-height: 1;
        letter-spacing: -0.04em;
      }
      p {
        color: #737979;
        line-height: 1.6;
      }
      button {
        margin-top: 1rem;
        border: 1px solid #181c1c;
        background: #ffe562;
        color: #181c1c;
        padding: 0.875rem 1.25rem;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: #f2d33f;
      }
      button:focus-visible {
        outline: 3px solid #ffe562;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">N</div>
      <h1>You’re offline</h1>
      <p>
        Manden can’t reach the network right now. Reconnect and try again to see
        the latest homes and availability.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
